name: Build Minecraft Mod

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v7


    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'


    - name: Build with Gradle
      run: sudo ./gradlew build


    - name: Check jar output
      run: |
        ls -l build/libs/*.jar
        test "$(ls build/libs/*.jar | grep -v -- '-sources.jar' | wc -l)" = "1"


    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: new-mod-${{ github.ref_name }}
        path: |
          build/libs/*.jar
          !build/libs/*-sources.jar
        if-no-files-found: error


    - name: Upload Release
      uses: softprops/action-gh-release@v3
      with:
        files: 'build/libs/!(*-sources).jar'
        fail_on_unmatched_files: true
