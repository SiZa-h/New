name: build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 创建 Release 和上传文件需要此权限

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: check generated assets (model, textures, item atlas rule)
        run: node tools/check-assets.js

      - name: check that all Java comments are English
        run: node tools/check-cjk.js

      - name: build
        run: ./gradlew build

      # 可选：仍然上传一份 Actions Artifact，方便在 Actions 页面下载
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

      # 用 gh CLI 创建 Release 并上传 JAR
      - name: Create Release and upload JAR via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          
          mapfile -t FILES < <(find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar')

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No JAR files found to upload"
            exit 1
          fi

          
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes

          
          gh release upload "$TAG" "${FILES[@]}" --clobber