name: Build Minecraft Mod

on:
  push:
    tags:
      - "v*"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'


    - name: Build with Gradle
      run: sudo./gradlew build


    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/libs/*.jar