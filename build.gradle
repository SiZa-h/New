plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "new-mod"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The data generation API is one module inside the Fabric API bundle, and a nested bundle module is not on
	// the compile classpath on its own — so it is declared explicitly here. This is what makes
	// `./gradlew runDatagen` and the providers in com.sizah.datagen compile.
	implementation "net.fabricmc.fabric-api:fabric-data-generation-api-v1:${project.fabric_datagen_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// `src/main/generated` is the output of `runDatagen`, and Loom puts it on the main source set, so it otherwise
// ends up in the sources jar as well. That is the one thing worth avoiding here: the generated JSON is data
// (models, loot, tags, language files) and it already travels inside the normal jar.
tasks.named("sourcesJar") {
	exclude("src/main/generated/**")
}

// **Run the generator in its own invocation**: `./gradlew runDatagen` and then `./gradlew build`.
//
// The generator runs on the compiled mod (`runDatagen` needs `classes`), while `sourcesJar` reads the folder the
// generator writes, and those two cannot be ordered — a dependency from `runDatagen` to `sourcesJar` is circular.
// Putting both in one command therefore trips Gradle's "implicit dependency" validation, which is exactly what CI
// used to do; the workflow now runs the two steps separately.
//
// The generated JSON is committed to version control, which is what makes a plain `./gradlew build` on a fresh
// checkout produce a complete jar. Re-run `runDatagen` and commit after adding content (see README).

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
